# E-admin-platform-56 (SEC2-17): analiza statica CodeQL pentru JavaScript/TypeScript (fara build).
# Scanarea de secrete + push protection sunt setari de repository (Settings > Code security),
# activate de PO — nu se configureaza din fisiere.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # luni, 03:17 UTC
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:javascript-typescript
