version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      next-react:
        patterns: [next, 'eslint-config-next', react, react-dom, '@types/react*']
      testing:
        patterns: [vitest, '@playwright/*', '@testing-library/*', jsdom]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /deploy/backup
    schedule:
      interval: weekly
  # imaginea Caddy e fixata prin digest (E-admin-platform-56); Dependabot urca tag + digest
  - package-ecosystem: docker
    directory: /deploy/gateway
    schedule:
      interval: weekly
