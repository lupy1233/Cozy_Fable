# Full-stack PRODUCTION-LIKE compose — self-host (VPS) sau test local end-to-end
# al imaginilor de deploy. NU e pentru dev (foloseste docker-compose.yml).
#
#   docker compose -f dev-infra/docker-compose.prod.yml up -d --build
#
# Frontend: http://localhost:8080  ·  Mailpit UI: http://localhost:8025
# Secretele de mai jos sunt DOAR pentru rulare locala — pe hosting real se seteaza
# din env/secret manager, nu din fisier.

name: cozy-fable-prod

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketplace}
      POSTGRES_DB: marketplace
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
    volumes:
      - miniodata_prod:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/uploads &&
      exit 0"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

  backend:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3001
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
      DATABASE_URL: postgresql://marketplace:${POSTGRES_PASSWORD:-marketplace}@postgres:5432/marketplace
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # presigned URLs trebuie sa fie accesibile din browser → endpointul PUBLIC al MinIO
      S3_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: uploads
      S3_REGION: us-east-1
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: no-reply@cozy-fable.local
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-prodlike-access-secret-min16}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-prodlike-refresh-secret-min16}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-prodlike-webhook-secret-16}
      IP_HASH_SALT: ${IP_HASH_SALT:-prodlike-salt}

  frontend:
    build:
      context: ..
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        BACKEND_INTERNAL_URL: http://backend:3001
    depends_on:
      - backend
    ports:
      - "8080:3000"

volumes:
  pgdata_prod:
  miniodata_prod:
