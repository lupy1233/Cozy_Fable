# Full-stack cu secrete obligatorii — self-host (VPS) sau test local end-to-end
# al imaginilor de deploy. NU e pentru dev (foloseste docker-compose.yml).
#
#   docker compose -f dev-infra/docker-compose.prod.yml up -d --build
#
# Frontend: http://localhost:8080  ·  Mailpit UI: http://localhost:8025
# Secretele se furnizeaza prin env/secret manager. Pentru demo local cu valori
# implicite foloseste docker-compose.yml. SMTP local Mailpit este explicit aici.

name: cozy-fable-prod

services:
  postgres:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: marketplace
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    ports:
      # 9002 pe host — dev-infra ocupa deja 9000
      - "9002:9000"
    volumes:
      - miniodata_prod:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command: ['mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" && mc mb --ignore-existing local/uploads']

  mailpit:
    image: axllent/mailpit@sha256:3bd7c2f2696deb35a4780d152b404dceec99cb041b942c0877b3b22384714f85
    ports:
      # 8026 pe host — dev-infra ocupa deja 8025
      - "8026:8025"

  backend:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3001
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
      # Implicit: parola URL-safe (ex. hex). Pentru caractere speciale furnizeaza
      # DATABASE_URL complet, cu parola percent-encoded; POSTGRES_PASSWORD ramane raw.
      DATABASE_URL: ${DATABASE_URL:-postgresql://marketplace:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/marketplace}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # presigned URLs trebuie sa fie accesibile din browser → endpointul PUBLIC al MinIO
      # (host.docker.internal functioneaza si din container si din browserul de pe host)
      S3_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://host.docker.internal:9002}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      S3_BUCKET: uploads
      S3_REGION: us-east-1
      SMTP_HOST: mailpit
      # stack local prod-like: Mailpit e intentionat; pe hostingul real NU se seteaza
      SMTP_ALLOW_DEV_HOST: 'true'
      SMTP_PORT: 1025
      MAIL_FROM: no-reply@cozy-fable.local
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      IP_HASH_SALT: ${IP_HASH_SALT:?Set IP_HASH_SALT}
      # obligatorie pe NODE_ENV=production (audit 2026-08-23: compose-ul dadea boot abort)
      MESSAGE_ENCRYPTION_KEY: ${MESSAGE_ENCRYPTION_KEY:?Set MESSAGE_ENCRYPTION_KEY}

  frontend:
    build:
      context: ..
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        BACKEND_INTERNAL_URL: http://backend:3001
    depends_on:
      - backend
    ports:
      - "8080:3000"

volumes:
  pgdata_prod:
  miniodata_prod:
